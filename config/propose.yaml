# Propose stage configuration — candidate rule generation workflow.
# These values are conservative and intentionally well-separated from the
# envelope and per-cycle ceilings to allow safe exploration space.

propose:
  target_candidates_per_cycle: 5          # how many candidates to keep per cycle
  draft_lm_budget_usd: 2.0                # budget for draft pass LLM calls
  adjudicate_lm_budget_usd: 3.0           # budget for adjudicate pass LLM calls
  draft_score_threshold: 0.5              # minimum cheap-pass score before review
  draft_model_id: qwen-plus               # draft pass model
  adjudicate_model_id: qwen-plus          # adjudicate pass model
