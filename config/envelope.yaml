# Phase 0 operator decisions. Frozen for pre-clock build and first clock run.
# Revisable at M2a only. Research budget only; no trading capital.

envelope:
  total_usd: 50000

clock:
  T_months: 18
  budget_usd: 15000
  N_min: 5
  K_replicate_months: 3
  relax_allowance: 1

data_scope:
  primary_domain: SEC EDGAR submissions
  initial_sources:
    - SEC EDGAR submissions
  shortlist_extensions:
    - FRED macro series
    - retail-accessible reference data

llm_families:
  # >=2 distinct training pipelines active at any time per Council requirement.
  # Shortlist of 3 so one can be rotated without dropping below 2.
  - Anthropic
  - OpenAI
  - Google

stack:
  language: python
  version: "3.12"
  storage:
    raw_store_path: data/rawstore
    audit_log_path: data/audit
    backup: off-site backup TBD
